<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title"><title id="title">Install Git and make your first commit</title><rect width="960" height="330" rx="16" fill="#f3f6fc"/><text x="24" y="35" fill="#214d96" font-family="Arial" font-size="16" font-weight="700">FROM FILES TO A LIVE SITE · 2</text><rect x="24" y="65" width="288" height="188" rx="14" fill="#fff" stroke="#cbd8eb"/><circle cx="56" cy="99" r="16" fill="#214d96"/><text x="51" y="105" font-family="Arial" font-size="16" fill="#fff">1</text><text x="44" y="148" font-family="Arial" font-size="20" font-weight="700" fill="#192b43">EDIT</text><text x="44" y="186" font-family="Arial" font-size="15" fill="#304b71">Files in working folder</text><text x="44" y="216" font-family="Arial" font-size="14" fill="#526984">git status / git diff</text><path d="M315 160h14m-5-5 5 5-5 5" fill="none" stroke="#214d96" stroke-width="2"/><rect x="334" y="65" width="288" height="188" rx="14" fill="#fff" stroke="#cbd8eb"/><circle cx="366" cy="99" r="16" fill="#214d96"/><text x="361" y="105" font-family="Arial" font-size="16" fill="#fff">2</text><text x="354" y="148" font-family="Arial" font-size="20" font-weight="700" fill="#192b43">STAGE</text><text x="354" y="186" font-family="Arial" font-size="15" fill="#304b71">Choose the next snapshot</text><text x="354" y="216" font-family="Arial" font-size="14" fill="#526984">git add named files</text><path d="M625 160h14m-5-5 5 5-5 5" fill="none" stroke="#214d96" stroke-width="2"/><rect x="644" y="65" width="288" height="188" rx="14" fill="#fff" stroke="#cbd8eb"/><circle cx="676" cy="99" r="16" fill="#214d96"/><text x="671" y="105" font-family="Arial" font-size="16" fill="#fff">3</text><text x="664" y="148" font-family="Arial" font-size="20" font-weight="700" fill="#192b43">COMMIT</text><text x="664" y="186" font-family="Arial" font-size="15" fill="#304b71">Save locally</text><text x="664" y="216" font-family="Arial" font-size="14" fill="#526984">git commit + git log</text></svg>