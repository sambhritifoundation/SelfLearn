<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300"><rect width="960" height="300" rx="16" fill="#101b28"/><text x="24" y="42" fill="#bcf476" font-family="Arial" font-size="28" font-weight="700">One feature at a time</text><rect x="24" y="82" width="288" height="182" rx="12" fill="#172638" stroke="#304255"/><text x="44" y="117" font-family="Arial" font-size="14" fill="#bcf476">01 · SAVE</text><text x="44" y="186" font-family="Arial" font-size="17" fill="#f2f5f7">Keep a working copy</text><path d="M44 223h200" stroke="#304255" stroke-width="4"/><rect x="334" y="82" width="288" height="182" rx="12" fill="#172638" stroke="#304255"/><text x="354" y="117" font-family="Arial" font-size="14" fill="#bcf476">02 · PROMPT</text><text x="354" y="186" font-family="Arial" font-size="17" fill="#f2f5f7">Add one theme button</text><path d="M354 223h200" stroke="#304255" stroke-width="4"/><rect x="644" y="82" width="288" height="182" rx="12" fill="#172638" stroke="#304255"/><text x="664" y="117" font-family="Arial" font-size="14" fill="#bcf476">03 · PLAY</text><text x="664" y="186" font-family="Arial" font-size="17" fill="#f2f5f7">Check old + new features</text><path d="M664 223h200" stroke="#304255" stroke-width="4"/></svg>