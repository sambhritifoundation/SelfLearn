<svg xmlns="http://www.w3.org/2000/svg" width="350" height="710" viewBox="0 0 350 710"><rect width="350" height="710" rx="16" fill="#101b28"/><text x="24" y="42" fill="#bcf476" font-family="Arial" font-size="20" font-weight="700">One tick of the game</text><rect x="24" y="72" width="302" height="182" rx="12" fill="#172638" stroke="#304255"/><text x="44" y="107" font-family="Arial" font-size="14" fill="#bcf476">01 · MOVE</text><text x="44" y="176" font-family="Arial" font-size="17" fill="#f2f5f7">Head goes one square</text><path d="M44 213h200" stroke="#304255" stroke-width="4"/><rect x="24" y="282" width="302" height="182" rx="12" fill="#172638" stroke="#304255"/><text x="44" y="317" font-family="Arial" font-size="14" fill="#bcf476">02 · EAT</text><text x="44" y="386" font-family="Arial" font-size="17" fill="#f2f5f7">Grow + add 10 points</text><path d="M44 423h200" stroke="#304255" stroke-width="4"/><rect x="24" y="492" width="302" height="182" rx="12" fill="#172638" stroke="#304255"/><text x="44" y="527" font-family="Arial" font-size="14" fill="#bcf476">03 · CHECK</text><text x="44" y="596" font-family="Arial" font-size="17" fill="#f2f5f7">Wall or body = game over</text><path d="M44 633h200" stroke="#304255" stroke-width="4"/></svg>