<svg xmlns="http://www.w3.org/2000/svg" width="960" height="455" viewBox="0 0 960 455" role="img" aria-labelledby="title"><title id="title">Build the first page</title><rect x="0" y="0" width="960" height="455" rx="0" fill="#f7faf6" stroke="none"/><rect x="0" y="0" width="960" height="82" rx="0" fill="#123c2b" stroke="none"/><text x="36" y="51" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">Build the first page</text><rect x="35" y="104" width="280" height="308" rx="14" fill="#fff" stroke="#d7e5d9"/><rect x="35" y="104" width="280" height="47" rx="14" fill="#eff5ef" stroke="none"/><rect x="35" y="136" width="280" height="15" rx="0" fill="#eff5ef" stroke="none"/><text x="53" y="135" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17372b">Three files</text><rect x="66" y="181" width="215" height="35" rx="7" fill="#e5f4e8" stroke="none"/><text x="77" y="204" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#146c4a">index.html</text><rect x="66" y="229" width="215" height="35" rx="7" fill="#e7f0fb" stroke="none"/><text x="77" y="252" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#245992">styles.css</text><rect x="66" y="277" width="215" height="35" rx="7" fill="#fff1d9" stroke="none"/><text x="77" y="300" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#9b5f11">app.js</text><text x="53" y="389" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#587267">Keep roles clear</text><rect x="340" y="104" width="280" height="308" rx="14" fill="#fff" stroke="#d7e5d9"/><rect x="340" y="104" width="280" height="47" rx="14" fill="#eff5ef" stroke="none"/><rect x="340" y="136" width="280" height="15" rx="0" fill="#eff5ef" stroke="none"/><text x="358" y="135" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17372b">Mobile layout</text><rect x="402" y="168" width="155" height="181" rx="17" fill="#fff" stroke="#aac6b2"/><rect x="418" y="185" width="123" height="28" rx="8" fill="#e5f4e8" stroke="none"/><rect x="418" y="222" width="123" height="22" rx="8" fill="#f2f6ef" stroke="none"/><rect x="418" y="254" width="55" height="62" rx="8" fill="#fff1d9" stroke="none"/><rect x="486" y="254" width="55" height="62" rx="8" fill="#e7f0fb" stroke="none"/><rect x="450" y="328" width="59" height="6" rx="8" fill="#cbd9c7" stroke="none"/><text x="371" y="369" font-family="Arial, sans-serif" font-size="15" font-weight="500" fill="#587267">Readable one column</text><text x="358" y="389" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#587267">Then widen the grid</text><rect x="645" y="104" width="280" height="308" rx="14" fill="#fff" stroke="#d7e5d9"/><rect x="645" y="104" width="280" height="47" rx="14" fill="#eff5ef" stroke="none"/><rect x="645" y="136" width="280" height="15" rx="0" fill="#eff5ef" stroke="none"/><text x="663" y="135" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17372b">Keyboard check</text><rect x="675" y="190" width="215" height="35" rx="7" fill="#e5f4e8" stroke="none"/><text x="686" y="213" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#146c4a">Tab → search</text><rect x="675" y="238" width="215" height="35" rx="7" fill="#e7f0fb" stroke="none"/><text x="686" y="261" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#245992">Tab → category</text><rect x="675" y="286" width="215" height="35" rx="7" fill="#fff1d9" stroke="none"/><text x="686" y="309" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#9b5f11">Enter → choose</text><text x="663" y="389" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#587267">No sideways scroll</text><path d="M319 258h20m-8-8 8 8-8 8M624 258h20m-8-8 8 8-8 8" stroke="#146c4a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="439" font-family="Arial, sans-serif" font-size="