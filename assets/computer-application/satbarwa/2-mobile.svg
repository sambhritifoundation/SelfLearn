<svg xmlns="http://www.w3.org/2000/svg" width="350" height="1120" viewBox="0 0 350 1120" role="img" aria-labelledby="title"><title id="title">Build the first page</title><rect x="0" y="0" width="350" height="1120" rx="0" fill="#f7faf6" stroke="none"/><rect x="0" y="0" width="350" height="82" rx="0" fill="#123c2b" stroke="none"/><text x="24" y="50" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">Build the first page</text><g transform="translate(0 0)"><rect x="35" y="104" width="280" height="308" rx="14" fill="#fff" stroke="#d7e5d9"/><rect x="35" y="104" width="280" height="47" rx="14" fill="#eff5ef" stroke="none"/><rect x="35" y="136" width="280" height="15" rx="0" fill="#eff5ef" stroke="none"/><text x="53" y="135" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17372b">Three files</text><rect x="66" y="181" width="215" height="35" rx="7" fill="#e5f4e8" stroke="none"/><text x="77" y="204" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#146c4a">index.html</text><rect x="66" y="229" width="215" height="35" rx="7" fill="#e7f0fb" stroke="none"/><text x="77" y="252" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#245992">styles.css</text><rect x="66" y="277" width="215" height="35" rx="7" fill="#fff1d9" stroke="none"/><text x="77" y="300" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#9b5f11">app.js</text><text x="53" y="389" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#587267">Keep roles clear</text></g><g transform="translate(-305 329)"><rect x="340" y="104" width="280" height="308" rx="14" fill="#fff" stroke="#d7e5d9"/><rect x="340" y="104" width="280" height="47" rx="14" fill="#eff5ef" stroke="none"/><rect x="340" y="136" width="280" height="15" rx="0" fill="#eff5ef" stroke="none"/><text x="358" y="135" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17372b">Mobile layout</text><rect x="402" y