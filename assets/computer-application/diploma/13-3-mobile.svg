<svg xmlns="http://www.w3.org/2000/svg" width="350" height="1135" viewBox="0 0 350 1135" role="img" aria-labelledby="title desc"><title id="title">Fix the shared allowance rate</title><desc id="desc">One assumption: Label the rate; Copy the formula: G2 stays fixed; Change test: All rows update</desc><rect x="0" y="0" width="350" height="1135" rx="0" fill="#f8fafc" stroke="none"/><rect x="0" y="0" width="350" height="82" rx="0" fill="#0f172a" stroke="none"/><text x="25" y="34" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Fix the shared allowance</text><text x="25" y="60" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">rate</text><g transform="translate(0 0)"><rect x="35" y="105" width="280" height="316" rx="14" fill="#fff" stroke="#dbe3ea"/><rect x="35" y="105" width="280" height="48" rx="14" fill="#f1f5f9" stroke="none"/><rect x="35" y="139" width="280" height="14" rx="0" fill="#f1f5f9" stroke="none"/><text x="53" y="137" fill="#172033" font-family="Arial, sans-serif" font-size="19" font-weight="700">One assumption</text><rect x="65" y="198" width="220" height="41" rx="8" fill="#ecfdf5" stroke="none"/><text x="77" y="225" fill="#0f766e" font-family="Arial, sans-serif" font-size="17" font-weight="700">G2 = 10%</text><text x="83" y="291" fill="#526276" font-family="Arial, sans-serif" font-size="15" font-weight="500">Not a tax rate</text><text x="53" y="397" fill="#526276" font-family="Arial, sans-serif" font-size="15" font-weight="500">Label the rate</text></g><g transform="translate(-305 328)"><rect x="340" y="105" width="280" height="316" rx="14" fill="#fff" stroke="#dbe3ea"/><rect x="340" y="105" width="280" height="48" rx="14" fill="#f1f5f9" stroke="none"/><rect x="340" y="139" width="280" height="14" rx="0" fill="#f1f5f9" stroke="none"/><text x="358" y="137" fill="#172033" font-family="Arial, sans-serif" font-size="19" font-weight="700">Copy the formula</text><rect x="370" y="198" width="220" height="41" rx="8" fill="#ecfdf5" stroke="none"/><text x="382" y="225" fill="#0f766e" font-family="Arial, sans-serif" font-size="17" font-weight="700">E2 = D2*$G$2</text><rect x="370" y="253" width="220" height="41" rx="8" fill="#eff6ff" stroke="none"/><text x="382" y="280" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="17" font-weight="700">E3 = D3*$G$2</text><text x="358" y="397" fill="#526276" font-family="Arial, sans-serif" font-size="15" font-weight="500">G2 stays fixed</text></g><g transform="translate(-610 656)"><rect x="645" y="105" width="280" height="316" rx="14" fill="#fff" stroke="#dbe3ea"/><rect x="645" y="105" width="280" height="48" rx="14" fill="#f1f5f9" stroke="none"/><rect x="645" y="139" width="280" height="14" rx="0" fill="#f1f5f9" stroke="none"/><text x="663" y="137" fill="#172033" font-family="Arial, sans-serif" font-size="19" font-weight="700">Change test</text><rect x="675" y="198" width="220" height="41" rx="8" fill="#fff7ed" stroke="none"/><text x="687" y="225" fill="#b45309" font-family="Arial, sans-serif" font-size="17" font-weight="700">G2 = 5%</text><rect x="675" y="253" width="220" height="41" rx="8" fill="#ecfdf5" stroke="none"/><text x="687" y="280" fill="#0f766e" font-family="Arial, sans-serif" font-size="17" font-weight="700">E2 = 35</text><text x="663" y="397" fill="#526276" font-family="Arial, sans-serif" font-size="15" font-weight="500">All rows update</text></g><text x="35" y="1110" fill="#526276" font-family="Arial, sans-serif" font-size="15" font-weight="500">Try it. Change one input. Check again.</text></svg>