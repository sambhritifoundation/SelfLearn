<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t d"><title id="t">Online safety decisions</title><desc id="d">A suspicious password request is contrasted with strong passwords, extra verification and careful sharing.</desc><rect width="720" height="330" rx="20" fill="#f4f8ff"/><text x="33" y="45" font-family="Arial" font-size="25" font-weight="bold" fill="#064eb2">Pause and check before you click</text><rect x="38" y="77" width="304" height="202" rx="13" fill="#fff5e9" stroke="#b86524" stroke-width="4"/><text x="59" y="117" font-family="Arial" font-size="20" font-weight="bold" fill="#913e12">Urgent message!</text><text x="59" y="151" font-family="Arial" font-size="18" fill="#243449">“Send your password</text><text x="59" y="179" font-family="Arial" font-size="18" fill="#243449">to keep your account.”</text><path d="M61 200h240" stroke="#d88d5a" stroke-width="3"/><text x="59" y="244" font-family="Arial" font-size="18" font-weight="bold" fill="#913e12">Phishing warning</text><rect x="374" y="77" width="308" height="202" rx="13" fill="#e8f7eb" stroke="#337d4c" stroke-width="4"/><g font-family="Arial" font-size="18" fill="#23593a"><text x="397" y="117">✓ Strong unique password</text><text x="397" y="155">✓ Extra sign-in check</text><text x="397" y="193">✓ Keep private details private</text><text x="397" y="231">✓ Ask a trusted adult</text></g><text x="360" y="310" text-anchor="middle" font-family="Arial" font-size="16" fill="#52657c">Do not share passwords through messages.</text></svg>
