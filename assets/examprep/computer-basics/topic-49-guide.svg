<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 406" role="img" aria-labelledby="title desc"><title id="title">Topic 49: Solve Common Computer Problems</title><desc id="desc">Four beginner concepts: Power check, Cable check, Volume setting, Network check.</desc><rect width="800" height="406" rx="24" fill="#f4f8ff"/><text x="32" y="43" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0757bf">Topic 49 · Solve Common Computer Problems</text><text x="32" y="70" font-family="Arial,sans-serif" font-size="16" fill="#52657c">Four ideas to know before the practice questions</text><g><rect x="30" y="90" width="356" height="134" rx="16" fill="#e8f1ff" stroke="#1c62b6" stroke-opacity=".35" stroke-width="2"/><circle cx="64" cy="125" r="19" fill="#1c62b6"/><text x="64" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="white">1</text><text x="94" y="132" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#1c62b6">Power check</text><text x="50" y="168" font-family="Arial,sans-serif" font-size="16" fill="#263a51">Confirms the device is receiving</text><text x="50" y="188" font-family="Arial,sans-serif" font-size="16" fill="#263a51">power.</text></g><g><rect x="414" y="90" width="356" height="134" rx="16" fill="#e7f7ed" stroke="#21744a" stroke-opacity=".35" stroke-width="2"/><circle cx="448" cy="125" r="19" fill="#21744a"/><text x="448" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="white">2</text><text x="478" y="132" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#21744a">Cable check</text><text x="434" y="168" font-family="Arial,sans-serif" font-size="16" fill="#263a51">Looks for a loose or missing</text><text x="434" y="188" font-family="Arial,sans-serif" font-size="16" fill="#263a51">connection.</text></g><g><rect x="30" y="242" width="356" height="134" rx="16" fill="#fff2e1" stroke="#a96313" stroke-opacity=".35" stroke-width="2"/><circle cx="64" cy="277" r="19" fill="#a96313"/><text x="64" y="284" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="white">3</text><text x="94" y="284" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#a96313">Volume setting</text><text x="50" y="320" font-family="Arial,sans-serif" font-size="16" fill="#263a51">Can explain why sound is not</text><text x="50" y="340" font-family="Arial,sans-serif" font-size="16" fill="#263a51">heard.</text></g><g><rect x="414" y="242" width="356" height="134" rx="16" fill="#f2eaff" stroke="#6b4fa7" stroke-opacity=".35" stroke-width="2"/><circle cx="448" cy="277" r="19" fill="#6b4fa7"/><text x="448" y="284" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="white">4</text><text x="478" y="284" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#6b4fa7">Network check</text><text x="434" y="320" font-family="Arial,sans-serif" font-size="16" fill="#263a51">Looks at connection status when a</text><text x="434" y="340" font-family="Arial,sans-serif" font-size="16" fill="#263a51">page will not load.</text></g></svg>
