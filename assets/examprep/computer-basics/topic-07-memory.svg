<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t d"><title id="t">RAM compared with SSD and HDD storage</title><desc id="d">RAM is temporary while SSD and HDD retain saved data after shutdown.</desc><rect width="720" height="330" rx="20" fill="#f4f8ff"/><text x="35" y="46" font-family="Arial" font-size="25" font-weight="bold" fill="#064eb2">Memory and storage</text><rect x="37" y="78" width="205" height="196" rx="14" fill="#e4f2ff" stroke="#3b76ae" stroke-width="4"/><rect x="74" y="116" width="133" height="49" rx="7" fill="#2c6d69"/><path d="M85 176h111" stroke="#c99b48" stroke-width="7"/><text x="140" y="144" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#fff">RAM</text><text x="140" y="210" text-anchor="middle" font-family="Arial" font-size="17" fill="#243449">active work</text><text x="140" y="237" text-anchor="middle" font-family="Arial" font-size="17" fill="#243449">temporary</text><rect x="263" y="78" width="205" height="196" rx="14" fill="#e8f7eb" stroke="#337d4c" stroke-width="4"/><rect x="305" y="114" width="122" height="62" rx="8" fill="#fff" stroke="#337d4c" stroke-width="4"/><text x="366" y="152" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold" fill="#337d4c">SSD</text><text x="366" y="210" text-anchor="middle" font-family="Arial" font-size="17" fill="#243449">saved files</text><text x="366" y="237" text-anchor="middle" font-family="Arial" font-size="17" fill="#243449">kept after power off</text><rect x="489" y="78" width="195" height="196" rx="14" fill="#fff3e0" stroke="#a47031" stroke-width="4"/><circle cx="586" cy="144" r="47" fill="#fff" stroke="#a47031" stroke-width="5"/><circle cx="586" cy="144" r="9" fill="#a47031"/><text x="586" y="209" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#73501f">HDD</text><text x="586" y="237" text-anchor="middle" font-family="Arial" font-size="17" fill="#243449">spinning storage</text><text x="360" y="307" text-anchor="middle" font-family="Arial" font-size="16" fill="#52657c">Save work to a drive to keep it after shutdown.</text></svg>
