<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t d"><title id="t">A processor with four cores</title><desc id="d">Illustrative CPU chip containing four cores, with instruction and clock speed labels.</desc><rect width="720" height="330" rx="20" fill="#f4f8ff"/><text x="36" y="47" font-family="Arial" font-size="25" font-weight="bold" fill="#064eb2">CPU: instructions, cores and clock</text><rect x="68" y="81" width="242" height="215" rx="14" fill="#355b89"/><rect x="90" y="102" width="198" height="172" rx="8" fill="#dcecff"/><g fill="#fff" stroke="#0075bb" stroke-width="4"><rect x="108" y="117" width="72" height="62" rx="5"/><rect x="199" y="117" width="72" height="62" rx="5"/><rect x="108" y="193" width="72" height="62" rx="5"/><rect x="199" y="193" width="72" height="62" rx="5"/></g><g font-family="Arial" font-size="18" fill="#315a86" text-anchor="middle"><text x="144" y="154">Core</text><text x="235" y="154">Core</text><text x="144" y="230">Core</text><text x="235" y="230">Core</text></g><text x="190" y="313" font-family="Arial" font-size="17" fill="#243449" text-anchor="middle">Executes instructions</text><rect x="465" y="88" width="204" height="105" rx="12" fill="#fff" stroke="#315a86" stroke-width="5"/><text x="567" y="135" font-family="Arial" font-size="35" font-weight="bold" fill="#064eb2" text-anchor="middle">GHz</text><text x="567" y="165" font-family="Arial" font-size="17" fill="#52657c" text-anchor="middle">clock frequency</text><text x="562" y="258" font-family="Arial" font-size="19" fill="#243449" text-anchor="middle">More GHz alone does not</text><text x="562" y="283" font-family="Arial" font-size="19" fill="#243449" text-anchor="middle">guarantee faster tasks.</text></svg>
