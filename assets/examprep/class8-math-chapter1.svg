<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370"><rect width="900" height="370" rx="24" fill="#eaf4ff"/><text x="35" y="55" font-family="Arial" font-size="31" font-weight="bold" fill="#163d68">Rational Numbers</text><rect x="35" y="82" width="250" height="244" rx="18" fill="white" stroke="#428ac4" stroke-width="3"/><text x="57" y="126" font-family="Arial" font-size="23" fill="#163d68">p/q, q ≠ 0</text><text x="57" y="175" font-family="Arial" font-size="18" fill="#163d68">Examples:</text><text x="57" y="212" font-family="Arial" font-size="24" fill="#163d68">−3/4, 0, 2</text><text x="57" y="283" font-family="Arial" font-size="17" fill="#163d68">Number line: −1 &lt; 0 &lt; 1</text><rect x="320" y="82" width="545" height="105" rx="18" fill="white" stroke="#428ac4" stroke-width="3"/><text x="343" y="125" font-family="Arial" font-size="21" font-weight="bold" fill="#163d68">Add: use a common denominator</text><text x="343" y="160" font-family="Arial" font-size="22" fill="#163d68">1/2 + 1/4 = 2/4 + 1/4 = 3/4</text><rect x="320" y="215" width="545" height="111" rx="18" fill="white" stroke="#428ac4" stroke-width="3"/><text x="343" y="259" font-family="Arial" font-size="21" font-weight="bold" fill="#163d68">Divide: multiply by the reciprocal</text><text x="343" y="296" font-family="Arial" font-size="22" fill="#163d68">a/b ÷ c/d = a/b × d/c</text></svg>
