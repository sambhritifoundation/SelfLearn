<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370"><rect width="900" height="370" rx="24" fill="#eaf4ff"/><text x="32" y="55" font-family="Arial" font-size="30" font-weight="bold" fill="#16436e">Real Numbers • Class 10</text><rect x="34" y="92" width="255" height="225" rx="18" fill="#fff" stroke="#5d92c0" stroke-width="3"/><text x="55" y="140" font-family="Arial" font-size="23" font-weight="bold" fill="#16436e">Prime factors</text><text x="55" y="195" font-family="Arial" font-size="22" fill="#16436e">24 = 2³ × 3</text><text x="55" y="238" font-family="Arial" font-size="22" fill="#16436e">36 = 2² × 3²</text><rect x="323" y="92" width="255" height="225" rx="18" fill="#fff" stroke="#5d92c0" stroke-width="3"/><text x="344" y="140" font-family="Arial" font-size="23" font-weight="bold" fill="#16436e">HCF and LCM</text><text x="344" y="195" font-family="Arial" font-size="22" fill="#16436e">HCF = 2² × 3 = 12</text><text x="344" y="238" font-family="Arial" font-size="22" fill="#16436e">LCM = 2³ × 3² = 72</text><rect x="612" y="92" width="255" height="225" rx="18" fill="#fff" stroke="#5d92c0" stroke-width="3"/><text x="633" y="140" font-family="Arial" font-size="23" font-weight="bold" fill="#16436e">Irrational</text><text x="633" y="195" font-family="Arial" font-size="21" fill="#16436e">√2 cannot equal p/q</text><text x="633" y="238" font-family="Arial" font-size="18" fill="#16436e">for integers p, q ≠ 0</text></svg>
