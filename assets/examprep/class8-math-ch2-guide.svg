<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360"><rect width="900" height="360" rx="24" fill="#eaf4ff"/><text x="32" y="54" font-family="Arial" font-size="30" font-weight="bold" fill="#17466c">Linear Equations in One Variable</text><rect x="35" y="91" width="253" height="220" rx="18" fill="white" stroke="#5192bf" stroke-width="3"/><text x="57" y="136" font-family="Arial" font-size="21" font-weight="bold" fill="#17466c">1. Balance</text><text x="57" y="180" font-family="Arial" font-size="19" fill="#17466c">3x + 5 = 20</text><text x="57" y="222" font-family="Arial" font-size="17" fill="#17466c">Subtract 5 on both sides</text><text x="57" y="263" font-family="Arial" font-size="19" fill="#17466c">3x = 15</text><text x="298" y="214" font-family="Arial" font-size="30" fill="#17466c">→</text><rect x="334" y="91" width="253" height="220" rx="18" fill="white" stroke="#5192bf" stroke-width="3"/><text x="356" y="136" font-family="Arial" font-size="21" font-weight="bold" fill="#17466c">2. Isolate x</text><text x="356" y="180" font-family="Arial" font-size="19" fill="#17466c">Divide both sides by 3</text><text x="356" y="235" font-family="Arial" font-size="27" fill="#0863a2">x = 5</text><text x="597" y="214" font-family="Arial" font-size="30" fill="#17466c">→</text><rect x="633" y="91" width="232" height="220" rx="18" fill="white" stroke="#5192bf" stroke-width="3"/><text x="655" y="136" font-family="Arial" font-size="21" font-weight="bold" fill="#17466c">3. Check</text><text x="655" y="180" font-family="Arial" font-size="19" fill="#17466c">3(5) + 5 = 20</text><text x="655" y="235" font-family="Arial" font-size="22" fill="#0863a2">20 = 20 ✓</text></svg>
