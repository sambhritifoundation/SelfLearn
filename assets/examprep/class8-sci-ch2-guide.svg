<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360"><rect width="900" height="360" rx="24" fill="#edf9f1"/><text x="32" y="54" font-family="Arial" font-size="30" font-weight="bold" fill="#185640">Metals and Non-metals</text><rect x="35" y="91" width="396" height="220" rx="18" fill="white" stroke="#56a071" stroke-width="3"/><text x="59" y="135" font-family="Arial" font-size="23" font-weight="bold" fill="#185640">Metals • usually</text><text x="59" y="178" font-family="Arial" font-size="19" fill="#185640">Shiny · form sheets · form wires</text><text x="59" y="218" font-family="Arial" font-size="19" fill="#185640">Conduct heat and electricity</text><text x="59" y="271" font-family="Arial" font-size="18" fill="#185640">Example: copper</text><rect x="469" y="91" width="396" height="220" rx="18" fill="white" stroke="#56a071" stroke-width="3"/><text x="493" y="135" font-family="Arial" font-size="23" font-weight="bold" fill="#185640">Non-metals • usually</text><text x="493" y="178" font-family="Arial" font-size="19" fill="#185640">Dull · brittle · poor conductors</text><text x="493" y="223" font-family="Arial" font-size="19" fill="#185640">Exceptions: graphite conducts;</text><text x="493" y="251" font-family="Arial" font-size="19" fill="#185640">iodine shines</text><text x="493" y="287" font-family="Arial" font-size="16" fill="#185640">Use several clues, not only one.</text></svg>
