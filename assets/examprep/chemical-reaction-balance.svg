<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="title desc"><title id="title">Balanced magnesium and oxygen reaction</title><desc id="desc">Two magnesium atoms and one oxygen molecule make two magnesium oxide units. Two magnesium and two oxygen atoms appear on each side.</desc><rect width="800" height="300" rx="22" fill="#f3f7ff"/><text x="38" y="48" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#064eb2">2Mg + O₂ → 2MgO</text><rect x="34" y="71" width="340" height="169" rx="18" fill="#e6f0ff" stroke="#91b5e9" stroke-width="2"/><rect x="426" y="71" width="340" height="169" rx="18" fill="#e6f8ed" stroke="#82c99a" stroke-width="2"/><text x="204" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#27446a">Reactants</text><text x="596" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#245740">Products</text><circle cx="98" cy="165" r="29" fill="#1272c4"/><circle cx="177" cy="165" r="29" fill="#1272c4"/><text x="98" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white">Mg</text><text x="177" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white">Mg</text><circle cx="285" cy="165" r="26" fill="#dd6740"/><circle cx="329" cy="165" r="26" fill="#dd6740"/><text x="285" y="173" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white">O</text><text x="329" y="173" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white">O</text><path d="M383 165h33m-10-10 10 10-10 10" fill="none" stroke="#536782" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="white"><circle cx="486" cy="165" r="27" fill="#1272c4"/><text x="486" y="173" text-anchor="middle">Mg</text><circle cx="540" cy="165" r="25" fill="#dd6740"/><text x="540" y="173" text-anchor="middle">O</text><circle cx="645" cy="165" r="27" fill="#1272c4"/><text x="645" y="173" text-anchor="middle">Mg</text><circle cx="699" cy="165" r="25" fill="#dd6740"/><text x="699" y="173" text-anchor="middle">O</text></g><text x="400" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#2c405c">Left: 2 Mg + 2 O    •    Right: 2 Mg + 2 O</text></svg>
