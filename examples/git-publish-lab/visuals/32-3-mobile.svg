<svg xmlns="http://www.w3.org/2000/svg" width="350" height="720" viewBox="0 0 350 720" role="img" aria-labelledby="title"><title id="title">Read changes, branch and merge</title><rect width="350" height="720" rx="16" fill="#f3f6fc"/><text x="24" y="35" fill="#214d96" font-family="Arial" font-size="16" font-weight="700">FROM FILES TO A LIVE SITE · 3</text><rect x="24" y="60" width="302" height="188" rx="14" fill="#fff" stroke="#cbd8eb"/><circle cx="56" cy="94" r="16" fill="#214d96"/><text x="51" y="100" font-family="Arial" font-size="16" fill="#fff">1</text><text x="44" y="143" font-family="Arial" font-size="20" font-weight="700" fill="#192b43">BRANCH</text><text x="44" y="181" font-family="Arial" font-size="15" fill="#304b71">main → improve-heading</text><text x="44" y="211" font-family="Arial" font-size="14" fill="#526984">Try one change</text><path d="M175 251v18m-5-5 5 5 5-5" fill="none" stroke="#214d96" stroke-width="2"/><rect x="24" y="275" width="302" height="188" rx="14" fill="#fff" stroke="#cbd8eb"/><circle cx="56" cy="309" r="16" fill="#214d96"/><text x="51" y="315" font-family="Arial" font-size="16" fill="#fff">2</text><text x="44" y="358" font-family="Arial" font-size="20" font-weight="700" fill="#192b43">REVIEW</text><text x="44" y="396" font-family="Arial" font-size="15" fill="#304b71">diff → test → commit</text><text x="44" y="426" font-family="Arial" font-size="14" fill="#526984">Understand every line</text><path d="M175 466v18m-5-5 5 5 5-5" fill="none" stroke="#214d96" stroke-width="2"/><rect x="24" y="490" width="302" height="188" rx="14" fill="#fff" stroke="#cbd8eb"/><circle cx="56" cy="524" r="16" fill="#214d96"/><text x="51" y="530" font-family="Arial" font-size="16" fill="#fff">3</text><text x="44" y="573" font-family="Arial" font-size="20" font-weight="700" fill="#192b43">MERGE</text><text x="44" y="611" font-family="Arial" font-size="15" fill="#304b71">Bring change to main</text><text x="44" y="641" font-family="Arial" font-size="14" fill="#526984">Resolve conflicts if needed</text></svg>